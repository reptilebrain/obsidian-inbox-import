name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Windows (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated integration tests
        shell: ${{ matrix.shell }}
        run: ./tests/run-tests.ps1
